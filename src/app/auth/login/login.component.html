<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<section id="wrapper" class="login-register login-sidebar"
    style="background-image:url(../assets/images/background/login-register.jpg);">
    <div class="login-box card pl-5">
        <div class="card-body">
            <form class="form-horizontal form-material" autocomplete="off" [formGroup]="loginForm" (ngSubmit)="login()"
                id="loginform">

                <div class="form-group row">
                    <div class="col-sm-12 text-center">
                        <a href="javascript:void(0)" class="text-center db">
                            <img src="../assets/images/logo-icon.png"
                                alt="Home"/>
                            </a>
                    </div>
                </div>


                <div class="form-group row">
                    <div class="col-sm-12 text-center">
                        <h4 class="font-bold">Registro de horas</h4>
                        <!-- <h6 class="font-bold"  *ngIf="ingresaUsuario">Ingresá Usuario y Contraseña</h6>                        
                        <h6 class="font-bold"  *ngIf="!ingresaUsuario">Ingresá tu Contraseña</h6>                        
                        <h6 class="font-bold"  *ngIf="!ingresaUsuario"></h6>                                                 -->
                        <span class="h6 font-bold" >
                            Click en Ingresar para Demo
                            <i class="fa fa-hand-o-down m-l-10"></i>
                        </span>
                    </div>
                </div>
                

                <div class="form-group row">
                    <div class="col-sm-12" *ngIf="ingresaUsuario">
                        <input class="form-control" type="email" placeholder="Email" formControlName="usuario">
                    </div>
                    <div class="col-sm-12" *ngIf="!ingresaUsuario && usuario">
                        <span class="text-muted">Usuario: </span>
                        <span class="h5 font-bold">{{usuario.LoginUsuario}}</span> 
                    </div>
                    <div class="col-xs-12">                        
                        <div class="input-group">
                            <input [type]="showPassword ? 'text' : 'password'"
                                id="password" class="form-control" 
                                placeholder="Contraseña" formControlName="clave"/>
                            <button type="button" class="btn btn-outline-secondary"
                                    (click)="togglePasswordVisibility()">
                              <i [class]="showPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i> <!-- Icono de Bootstrap Icons -->
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-md-12">
                        <div class="checkbox checkbox-primary pull-left p-t-0">
                            <input id="checkbox-signup" type="checkbox" class="filled-in chk-col-light-blue"
                                formControlName="remember">
                            <label for="checkbox-signup"> Recordar usuario </label>
                        </div>
                    </div>
                    <div class="col-md-12 text-center m-t-5">
                        <button class="btn btn-lg btn-block text-uppercase btn-rounded"
                            style="background-color: #8c2332 !important; border-color: #8c2332 !important;"
                            type="submit">
                            <span class="text-white">Ingresar</span>
                        </button>
                    </div>
                </div>
                               

                <div class="form-group m-b-0">
                    <div class="col-sm-12 text-center">
                        <p>¿Te olvidaste la contraseña?</p>
                        <a href="#" class="text-info m-l-5" (click)="recuperarClave($event)" *ngIf="!procesando"><b>Solicitar Contraseña</b></a>                        
                    </div>
                    <div class="col-sm-12 text-center m-t-10" *ngIf="procesando">
                        <div class="alert alert-info" role="alert">
                            <i class="fa fa-spin fa-refresh fa-2x"></i>
                            <p class="mb-0">Por favor espere...</p>
                        </div>
                    </div>
                    <div class="col-sm-12 text-center m-t-10" *ngIf="recuperaClaveOK">
                        <div class="alert alert-info" role="alert">
                            La solicitud se realizó correctamente, recibirás un correo electrónico. 
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </div>
</section>
<!-- ============================================================== -->
<!-- End Wrapper -->
<!-- ============================================================== -->
