<div class="offcanvas-header">
    <h3 class="box-title m-b-0">Filtrar Operaciones</h3>
    <button type="button" class="btn-close" aria-label="Close" (click)="onClickCerrar()"></button>
</div>
<div class="offcanvas-body">
    <form autocomplete="off" [formGroup]="formulario" (ngSubmit)="onClickSubmit()">

        <div class="form-group row">

            <div class="btn-group m-b-5" role="group" aria-label="Periodos">
                <button type="button" class="btn" (click)="onClickPeriodo(1)" [class.btn-secondary]="periodoFechas==1"
                    [class.btn-outline-secondary]="periodoFechas!=1">
                    7 días
                </button>
                <button type="button" class="btn" (click)="onClickPeriodo(2)" [class.btn-secondary]="periodoFechas==2"
                    [class.btn-outline-secondary]="periodoFechas!=2">
                    30 días
                </button>
                <button type="button" class="btn" (click)="onClickPeriodo(3)" [class.btn-secondary]="periodoFechas==3"
                    [class.btn-outline-secondary]="periodoFechas!=3">
                    90 días
                </button>
                <button type="button" class="btn" (click)="onClickPeriodo(4)" [class.btn-secondary]="periodoFechas==4"
                    [class.btn-outline-secondary]="periodoFechas!=4">
                    Personalizado
                </button>
            </div>
            
            <ng-container *ngIf="periodoFechas==4">
                <label class="col-3 control-label col-form-label">Desde:</label>
                <div class="col-9 m-b-5">
                    <div class="input-group">
                        <span class="input-group-addon" (click)="dteFechaDesde.toggle()">
                            <i class="fa fa-calendar"></i>
                        </span>
                        <input class="form-control" placeholder="dd/mm/aaaa" name="dteFechaDesde"
                            formControlName="fechaDesde" ngbDatepicker #dteFechaDesde="ngbDatepicker" />
                    </div>
                </div>
                <label class="col-3 control-label col-form-label">Hasta:</label>
                <div class="col-9 m-b-5">
                    <div class="input-group">
                        <span class="input-group-addon" (click)="dteFechaHasta.toggle()">
                            <i class="fa fa-calendar"></i>
                        </span>
                        <input class="form-control" placeholder="dd/mm/aaaa" name="dteFechaHasta"
                            formControlName="fechaHasta" ngbDatepicker #dteFechaHasta="ngbDatepicker" />
                    </div>
                </div>
            </ng-container>

            <div class="col-12 m-b-5">
                <ng-container ngif="usuarioDeshabilitado">
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="fa  fa-list-alt"></i>
                        </span>
                        <input id="usuarioTypeahead" type="text" class="form-control" formControlName="usuario"
                            placeholder="Usuario" 
                            [inputFormatter]="formatterUsuario"
                            [resultFormatter]="formatterUsuario"
                            editable="false"
                            [ngbTypeahead]="searchUsuario"
                            (focus)="focusUsuario$.next($any($event).target.value)"
                            (click)="clickUsuario$.next($any($event).target.value)"
                            #instanceUsuario="ngbTypeahead" />
                        <span class="input-group-addon" role="button" (click)="onClickLimpiarTypeahead('usuario')">
                            <i class="fa fa-times"></i>
                        </span>
                    </div>    
                </ng-container>
                
            </div>


            <div class="col-12 m-b-5">
                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="fa fa-user-o"></i>
                    </span>                   
                    <input id="clienteTypeahead-focus" type="text" class="form-control" 
                        formControlName="cliente"
                        placeholder="Cliente" 
                        [inputFormatter]="formatterCliente"
                        [resultFormatter]="formatterCliente"
                        editable="false" 
                        [ngbTypeahead]="searchCliente" 
                        (focus)="focusCliente$.next($any($event).target.value)"
                        (click)="clickCliente$.next($any($event).target.value)" #instancecliente="ngbTypeahead" />
                    <span class="input-group-addon" (click)="onClickLimpiarTypeahead('cliente')">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>

            <div class="col-12 m-b-5">
                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="fa  fa-list-alt"></i>
                    </span>
                    <input id="proyectoTypeahead" type="text" class="form-control" formControlName="proyecto"
                        placeholder="Proyecto" 
                        [inputFormatter]="formatterProyecto"
                        [resultFormatter]="formatterProyecto"
                        editable="false" 
                        [ngbTypeahead]="searchProyecto"
                        (focus)="focusProyecto$.next($any($event).target.value)"
                        (click)="clickProyecto$.next($any($event).target.value)" #instanceProyecto="ngbTypeahead" />
                    <span class="input-group-addon" role="button" (click)="onClickLimpiarTypeahead('proyecto')">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>
            
            <div class="col-12 m-b-5">
                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="fa  fa-list-alt"></i>
                    </span>
                    <input id="funcionTypeahead" type="text" class="form-control" formControlName="funcion"
                        placeholder="Funcion" 
                        [inputFormatter]="formatterFuncion"
                        [resultFormatter]="formatterFuncion"
                        editable="false" 
                        [ngbTypeahead]="searchFuncion"
                        (focus)="focusFuncion$.next($any($event).target.value)"
                        (click)="clickFuncion$.next($any($event).target.value)"
                        #instanceFuncion="ngbTypeahead" />
                    <span class="input-group-addon" role="button" (click)="onClickLimpiarTypeahead('funcion')">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>

            <div class="col-12 m-b-5">
                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="fa  fa-list-alt"></i>
                    </span>
                    <input id="clasificacionTypeahead" type="text" class="form-control" formControlName="clasificacion"
                        placeholder="Clasificacion" 
                        [inputFormatter]="formatterClasificacion"
                        [resultFormatter]="formatterClasificacion"
                        editable="false" 
                        [ngbTypeahead]="searchClasificacion"
                        (focus)="focusClasificacion$.next($any($event).target.value)"
                        (click)="clickClasificacion$.next($any($event).target.value)"
                        #instanceClasificacion="ngbTypeahead" />
                    <span class="input-group-addon" role="button" (click)="onClickLimpiarTypeahead('clasificacion')">
                        <i class="fa fa-times"></i>
                    </span>
                </div>
            </div>

            <label class="col-3 control-label col-form-label text-right">Período:</label>
            <div class="col-6 control-label col-form-label">
                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="fa fa-calendar"></i>
                    </span>
                    <select class="form-control custom-select"  formControlName="periodoRegistroMes">
                        <option value=""></option>
                        <option *ngFor="let item of meses" [value]="item">
                            {{item}}
                        </option>
                    </select>
                </div>
            </div>
            <div class="col-3 control-label col-form-label">
                <div class="input-group">
                    <input type="text" class="form-control" formControlName="periodoRegistroAnio" >
                </div>
            </div>


        </div>

        <div class="text-end">
            <button type="button" class="btn btn-outline-success waves-effect waves-light m-r-10"
                (click)="onClickSubmit()">
                <i class="fa fa-check"></i>
                Aplicar filtros
            </button>
            <button type="button" class="btn btn-outline-inverse waves-effect waves-light" (click)="onClickCerrar()">
                <i class="fa fa-times m-2"></i>
                Cancelar
            </button>
        </div>

        <div class="form-group row" style="height: 150px;"></div>

    </form>
</div>
